<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(${title})}"></head><body th:attr="data-page=${page}"><header th:replace="~{fragments :: header}"></header><main id="main"><div class="page-heading"><div><p class="eyebrow">MESA DE AYUDA</p><h1 th:text="${title}"></h1></div></div><div th:replace="~{fragments :: messages}"></div><section class="card narrow"><p id="requester-data" class="muted">Cargando solicitante…</p><form id="ticket-form"><label for="equipment">Nombre del equipo</label><input id="equipment" name="equipment" maxlength="120" required><label for="pcUser">Usuario de PC</label><input id="pcUser" name="pcUser" maxlength="100" required><label for="priority">Prioridad</label><select id="priority" name="priority"><option value="MEDIA">Media</option><option value="ALTA">Alta</option><option value="BAJA">Baja</option></select><label for="description">Descripción del problema</label><textarea id="description" name="description" rows="6" maxlength="4000" required></textarea><p class="muted">Después del registro puede adjuntar evidencias mientras el ticket esté pendiente.</p><button class="primary" type="submit">Registrar ticket</button></form></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
