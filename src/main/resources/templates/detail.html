<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(${title})}"></head><body th:attr="data-page=${page},data-ticket-id=${ticketId}"><header th:replace="~{fragments :: header}"></header><main id="main"><div class="page-heading"><div><p class="eyebrow">MESA DE AYUDA</p><h1 th:text="${title}"></h1></div></div><div th:replace="~{fragments :: messages}"></div><section id="ticket-detail" class="card"><p>Cargando ticket…</p></section><section class="card"><h2>Gestionar ticket</h2><form id="transition-form"><label for="observation">Observación / informe técnico / motivo de rechazo</label><textarea id="observation" name="observation" rows="4" maxlength="4000"></textarea><div id="transition-buttons" class="button-row"></div><p id="next-step" class="muted"></p></form></section><section class="card"><h2>Evidencias</h2><ul id="attachment-list"><li>Cargando evidencias…</li></ul><form id="attachment-form" hidden><label for="file">Adjuntar evidencia (máximo 10 MB)</label><input id="file" name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.txt" required><button type="submit" class="primary">Adjuntar</button></form></section><section class="card"><h2>Historial de cambios</h2><ol id="history-list"></ol></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
