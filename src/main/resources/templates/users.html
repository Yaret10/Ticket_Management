<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(${title})}"></head><body th:attr="data-page=${page}"><header th:replace="~{fragments :: header}"></header><main id="main"><div class="page-heading"><div><p class="eyebrow">MESA DE AYUDA</p><h1 th:text="${title}"></h1></div></div><div th:replace="~{fragments :: messages}"></div><section class="card narrow"><p>El registro requiere permiso explícito de TI. Solo puede asignar los roles autorizados.</p><form id="user-form"><label for="dni">DNI</label><input id="dni" name="dni" pattern="[0-9]{8}" inputmode="numeric" maxlength="8" required><label for="username">Usuario</label><input id="username" name="username" maxlength="100" required><label for="name">Nombre completo</label><input id="name" name="name" maxlength="120" required><label for="email">Correo</label><input id="email" name="email" type="email" maxlength="254" required><label for="password">Contraseña inicial (12–72 caracteres)</label><input id="password" name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required><label for="areaId">Área principal</label><select id="areaId" name="areaId" required></select><label for="position">Cargo</label><input id="position" name="position" maxlength="120" required><label for="employeeCode">Código de personal</label><input id="employeeCode" name="employeeCode" maxlength="100"><fieldset><legend>Roles autorizados</legend><div id="role-options"></div></fieldset><fieldset id="managed-area-fieldset"><legend>Áreas de gestión (solo Gerente)</legend><div id="area-options"></div></fieldset><button class="primary" type="submit">Registrar usuario</button></form></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
