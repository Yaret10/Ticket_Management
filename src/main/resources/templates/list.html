<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(${title})}"></head><body th:attr="data-page=${page}"><header th:replace="~{fragments :: header}"></header><main id="main"><div class="page-heading"><div><p class="eyebrow">MESA DE AYUDA</p><h1 th:text="${title}"></h1></div></div><div th:replace="~{fragments :: messages}"></div><section class="card"><form id="filters" class="filters"><div><label for="q">Buscar</label><input id="q" name="q" maxlength="200" placeholder="Código, equipo o descripción"></div><div><label for="state">Estado</label><select id="state" name="state"><option value="">Todos</option><option>PENDIENTE</option><option>APROBADO</option><option>ATENDIDO</option><option>RECHAZADO</option><option>CERRADO</option></select></div><div><label for="priority">Prioridad</label><select id="priority" name="priority"><option value="">Todas</option><option>ALTA</option><option>MEDIA</option><option>BAJA</option></select></div><div><label for="sort">Ordenar por</label><select id="sort" name="sort"><option value="createdAt">Fecha</option><option value="code">Código</option><option value="state">Estado</option><option value="priority">Prioridad</option></select></div><div><label for="ascending">Dirección</label><select id="ascending" name="ascending"><option value="false">Descendente</option><option value="true">Ascendente</option></select></div><button class="primary" type="submit">Buscar</button><button type="button" id="export">Exportar Excel</button></form><p id="results-info" role="status">Cargando tickets…</p><div class="table-wrap"><table><caption class="sr-only">Tickets visibles para su usuario</caption><thead><tr><th scope="col">Código</th><th scope="col">Equipo</th><th scope="col">Solicitante / área</th><th scope="col">Prioridad</th><th scope="col">Estado</th><th scope="col">Registro</th></tr></thead><tbody id="tickets-body"></tbody></table></div><div class="pagination"><button id="previous" type="button">Anterior</button><span id="page-info"></span><button id="next" type="button">Siguiente</button></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
