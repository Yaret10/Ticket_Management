<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Iniciar sesión')}"></head>
<body data-page="login" class="auth-page"><main class="auth-card"><img class="auth-logo" src="/images/logo.png" alt="STROBBE"><h1>con<span class="accent">TI</span>go</h1><p>Tu soporte de tecnología, en un solo lugar.</p><h2>Iniciar sesión</h2><div th:replace="~{fragments :: messages}"></div><form id="login-form"><label for="dni">DNI</label><input id="dni" name="dni" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="username" required><label for="password">Contraseña</label><input id="password" name="password" type="password" maxlength="72" autocomplete="current-password" required><button class="primary" type="submit">Ingresar</button></form><p class="muted">Para restablecer su contraseña, contacte al personal autorizado de TI.</p></main></body></html>
