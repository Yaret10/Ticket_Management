spring.application.name=contigo
spring.profiles.default=local
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=contigo;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.tracking-modes=cookie
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
logging.structured.format.console=ecs
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
app.auth.private-key=${JWT_PRIVATE_KEY:file:./.local/private.pem}
app.auth.public-key=${JWT_PUBLIC_KEY:file:./.local/public.pem}
app.auth.issuer=${JWT_ISSUER:contigo}
app.auth.audience=${JWT_AUDIENCE:contigo-web}
app.auth.access-ttl=${ACCESS_TTL:15m}
app.auth.refresh-ttl=${REFRESH_TTL:7d}
app.auth.secure-cookies=${SECURE_COOKIES:true}
app.storage.root=${ATTACHMENTS_ROOT:./.local/evidence}
app.mail.mode=${MAIL_MODE:local}
app.mail.tenant-id=${GRAPH_TENANT_ID:}
app.mail.client-id=${GRAPH_CLIENT_ID:}
app.mail.client-secret=${GRAPH_CLIENT_SECRET:}
app.mail.sender=${GRAPH_SENDER_EMAIL:}
app.mail.ti-addresses=${NOTIFY_TI:}
app.mail.default-cc=${NOTIFY_DEFAULT_CC:}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
springdoc.swagger-ui.csrf.enabled=true
